name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-lint-${{ hashFiles('requirements.txt') }}

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: |
          ruff check app.py src/ tests/ \
            --select E,F,W \
            --ignore E501,W503 \
            --output-format github

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.2.0 pytest-cov==5.0.0

      - name: Run tests
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  validate-app:
    name: Validate app.py
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-validate-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check app.py
        run: python -m py_compile app.py && echo "app.py syntax OK"

      - name: Import check — top-level packages
        run: |
          python -c "
          import streamlit, torch, numpy, matplotlib, sklearn, pandas, scipy
          print('All top-level imports OK')
          "

      - name: Import check — src models
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from src.models.cnn import ECGCNN
          from src.models.kan_head import KANHead
          from src.models.cnn_kan import ECGCNNWithKAN
          print('All model imports OK')
          "
